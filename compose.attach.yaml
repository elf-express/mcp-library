# 只部署 docs-mcp + 一次性 registrar,把書註冊進「現有」的 MCPJungle gateway;不另起 gateway / DB。
#   MCPJUNGLE_NETWORK  現有 gateway 所在的 Docker 網路完整名(預設 mcp-library_mcpjungl = 本 repo 主堆疊)
#   REGISTRY_URL       registrar 連 gateway 的位址(預設 http://mcpjungle:8080 = 本 repo 主堆疊的服務名)
#   REGISTER_EXTRAS    預設 0 = 只註冊各本書(由 corpus.json 自動產生;現有 gateway 多半已有 filesystem/fetch/time)
#   REGISTER_LIST      有值時只註冊這些 server
# 起:docker compose -f compose.attach.yaml up -d --build
name: mcp-library-attach

services:
  docs-mcp-server:
    extends:
      file: compose.yaml
      service: docs-mcp-server
    networks: !override [gateway]

  registrar:
    extends:
      file: compose.yaml
      service: registrar
    depends_on: !override
      docs-mcp-server:
        condition: service_healthy
    environment:
      REGISTRY_URL: ${REGISTRY_URL:-http://mcpjungle:8080}
      REGISTER_EXTRAS: ${REGISTER_EXTRAS:-0}
    networks: !override [gateway]

networks:
  gateway:
    external: true
    name: ${MCPJUNGLE_NETWORK:-mcp-library_mcpjungl}
