name: CI

# =============================================================================
# monorepo 版通用 CI
# 觸發:push / PR 到 main
# 內含:
#   - basics:    commit lint、大檔案檢查、機密掃描
#   - build-test: docs-mcp-server 的 TypeScript build + 單元測試(上傳 JUnit 報告)
#   - gateway:    mcpjungle/gateway 的 go build / go test / golangci-lint
#   - docker-build: matrix — PR 時只 build 不 push(驗證映像可建)
# repo 政策只允許官方與已驗證發行者的 action,且必須釘 SHA。
# =============================================================================

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  basics:
    name: Basics (commit / file check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      # 用內建 shell 檢查,不引用第三方 action(repo 政策只允許官方與已驗證發行者)
      - name: Check commit messages (Conventional Commits)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|deploy)(\([^)]+\))?!?: .+'
          BAD=0
          while IFS= read -r line; do
            subject="${line#* }"
            if ! printf '%s\n' "$subject" | grep -qE "$PATTERN"; then
              echo "::error::不符合 Conventional Commits:$line"
              BAD=1
            fi
          done < <(git log --no-merges --format='%h %s' "$BASE_SHA..$HEAD_SHA")
          if [ "$BAD" -ne 0 ]; then
            echo "::error::commit 標題需為 type(scope): 說明,type 限 $PATTERN"
            exit 1
          fi
          echo "commit 標題皆符合 Conventional Commits"

      - name: Check for large files (> 5MB)
        run: |
          LARGE_FILES=$(find . -type f -size +5M -not -path "./.git/*" -not -path "*/node_modules/*" || true)
          if [ -n "$LARGE_FILES" ]; then
            echo "::error::發現大檔案(>5MB),請考慮使用 Git LFS:"
            echo "$LARGE_FILES"
            exit 1
          fi

      - name: Check for forbidden patterns (basic secret scan)
        run: |
          PATTERN='(password|passwd|secret|api[_-]?key|access[_-]?token|auth[_-]?token|connection[_-]?string|private[_-]?key|client[_-]?secret)["'"'"']?\s*[:=]\s*["'"'"'][^"'"'"']{8,}["'"'"']'
          if grep -rniE "$PATTERN" \
               --include="*.cs" --include="*.ts" --include="*.js" --include="*.mjs" \
               --include="*.json" --include="*.yml" --include="*.yaml" \
               --include="*.env*" --include="*.config" --include="*.properties" \
               --exclude="*.example*" --exclude="*.sample*" \
               --exclude="package-lock.json" \
               --exclude-dir=node_modules --exclude-dir=bin --exclude-dir=obj \
               --exclude-dir=.git --exclude-dir=dist --exclude-dir=build \
               --exclude-dir=examples . ; then
            echo "::error::偵測到疑似機密資訊硬編碼"
            echo "::error::請改用環境變數、.env(已 .gitignore)或 secret manager"
            echo "::error::若為誤判,請用 *.example 後綴或在該行加 // pragma: allowlist secret"
            exit 1
          fi
          echo "未發現明顯機密資訊"

  gateway:
    name: Gateway (go build / test / lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcpjungle/gateway
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup Node.js(dashboard 建置)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcpjungle/gateway/web/dashboard/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: mcpjungle/gateway/go.mod
          cache-dependency-path: mcpjungle/gateway/go.sum

      # internal/dashboardui 以 //go:embed dist 內嵌前端,沒有 dist 無法編譯
      - name: Build dashboard
        run: bash scripts/build-dashboard.sh

      - name: Go build
        run: go build ./...

      - name: Go test
        run: go test ./...

      - name: Lint
        env:
          GOTOOLCHAIN: auto
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run ./...

  build-test:
    name: Build & Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: docs-mcp-server
            dir: mcpjungle/docs-mcp-server
            node: 24
            test_args: -- --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check & Build
        run: npm run build

      - name: Run unit tests
        run: npm test ${{ matrix.test_args }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-results-${{ matrix.name }}
          path: ${{ matrix.dir }}/test-results/
          if-no-files-found: ignore

      - name: Verify build output
        run: |
          if [ ! -f dist/index.js ]; then
            echo "::error::Build did not produce dist/index.js"
            exit 1
          fi
          echo "Build artifacts:"
          ls -la dist/

  docker-build:
    name: Docker Build Verify (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [build-test, gateway]
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: docs-mcp-server
            context: ./mcpjungle
            dockerfile: ./mcpjungle/docs-mcp-server/Dockerfile
          - image: mcpjungle-gateway
            context: ./mcpjungle/gateway
            dockerfile: ./mcpjungle/gateway/Dockerfile.fullbuild
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.context) }}
          push: false
          load: true
          tags: ${{ matrix.image }}:ci-test
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
