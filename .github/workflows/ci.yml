name: CI

# =============================================================================
# monorepo 版通用 CI
# 觸發:push dev / release / hotfix/**,以及所有 PR(開發分支經 PR 進 dev,見 BRANCHING.md)
# 內含:
#   - basics:    commit lint、compose 驗證、大檔案檢查、機密掃描
#   - registry:   gen-book-configs / registrar.sh 的 node --test
#   - build-test: docs-mcp-server 的 TypeScript build + 單元測試(上傳 JUnit 報告)
#   - gateway:    mcpjungle/gateway 的 go build / go test / golangci-lint
#   - docker-build: matrix — PR 與 push dev 時只 build 不 push(驗證映像可建);
#                 只有 push dev 寫 buildkit 快取,PR 只讀(避免每個 PR 各存一份塞爆快取上限)
#   - ci:        彙總 job;組織 ruleset elf-require-ci 只要求這一個檢查(以 name 比對,勿改名),
#                needs 必須列出上面所有 job
# repo 政策只允許官方與已驗證發行者的 action,且必須釘 SHA。
# =============================================================================

on:
  push:
    branches: [dev, release, 'hotfix/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  basics:
    name: Basics (commit / file check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      # 用內建 shell 檢查,不引用第三方 action(repo 政策只允許官方與已驗證發行者)
      - name: Check commit messages (Conventional Commits)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|deploy)(\([^)]+\))?!?: .+'
          BAD=0
          while IFS= read -r line; do
            subject="${line#* }"
            if ! printf '%s\n' "$subject" | grep -qE "$PATTERN"; then
              echo "::error::不符合 Conventional Commits:$line"
              BAD=1
            fi
          done < <(git log --no-merges --format='%h %s' "$BASE_SHA..$HEAD_SHA")
          if [ "$BAD" -ne 0 ]; then
            echo "::error::commit 標題需為 type(scope): 說明,type 限 $PATTERN"
            exit 1
          fi
          echo "commit 標題皆符合 Conventional Commits"

      - name: Validate compose files
        run: |
          files="$(git ls-files '*compose*.yml' '*compose*.yaml' | sort | tr '\n' ' ')"
          if [ "$files" != "compose.attach.yaml compose.pull.yaml compose.yaml " ]; then
            echo "::error::compose 檔只能是根目錄 3 份,目前:$files"; exit 1
          fi
          if grep -n 'container_name' compose.yaml compose.pull.yaml compose.attach.yaml; then
            echo "::error::compose 不可寫死 container_name(-p mcp-test 並存會撞名)"; exit 1
          fi
          docker compose -f compose.yaml config -q
          docker compose -f compose.pull.yaml config -q
          MCPJUNGLE_NETWORK=dummy docker compose -f compose.attach.yaml config -q

      - name: Check for large files (> 5MB)
        run: |
          LARGE_FILES=$(find . -type f -size +5M -not -path "./.git/*" -not -path "*/node_modules/*" || true)
          if [ -n "$LARGE_FILES" ]; then
            echo "::error::發現大檔案(>5MB),請考慮使用 Git LFS:"
            echo "$LARGE_FILES"
            exit 1
          fi

      - name: Check for forbidden patterns (basic secret scan)
        run: |
          PATTERN='(password|passwd|secret|api[_-]?key|access[_-]?token|auth[_-]?token|connection[_-]?string|private[_-]?key|client[_-]?secret)["'"'"']?\s*[:=]\s*["'"'"'][^"'"'"']{8,}["'"'"']'
          if grep -rniE "$PATTERN" \
               --include="*.cs" --include="*.ts" --include="*.js" --include="*.mjs" \
               --include="*.json" --include="*.yml" --include="*.yaml" \
               --include="*.env*" --include="*.config" --include="*.properties" \
               --exclude="*.example*" --exclude="*.sample*" \
               --exclude="package-lock.json" \
               --exclude-dir=node_modules --exclude-dir=bin --exclude-dir=obj \
               --exclude-dir=.git --exclude-dir=dist --exclude-dir=build \
               --exclude-dir=examples . ; then
            echo "::error::偵測到疑似機密資訊硬編碼"
            echo "::error::請改用環境變數、.env(已 .gitignore)或 secret manager"
            echo "::error::若為誤判,請用 *.example 後綴或在該行加 // pragma: allowlist secret"
            exit 1
          fi
          echo "未發現明顯機密資訊"

  gateway:
    name: Gateway (go build / test / lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcpjungle/gateway
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup Node.js(dashboard 建置)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcpjungle/gateway/web/dashboard/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: mcpjungle/gateway/go.mod
          cache-dependency-path: mcpjungle/gateway/go.sum

      # internal/dashboardui 以 //go:embed dist 內嵌前端,沒有 dist 無法編譯
      - name: Build dashboard
        run: bash scripts/build-dashboard.sh

      - name: Go build
        run: go build ./...

      - name: Go test
        run: go test ./...

      - name: Lint
        env:
          GOTOOLCHAIN: auto
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run ./...

  registry:
    name: Registrar (node --test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version: 24

      - name: Test gen-book-configs / registrar.sh
        run: node --test "mcpjungle/registry/*.test.mjs"

  build-test:
    name: Build & Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: docs-mcp-server
            dir: mcpjungle/docs-mcp-server
            node: 24
            test_args: -- --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check & Build
        run: npm run build

      - name: Run unit tests
        run: npm test ${{ matrix.test_args }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-results-${{ matrix.name }}
          path: ${{ matrix.dir }}/test-results/
          if-no-files-found: ignore

      - name: Verify build output
        run: |
          if [ ! -f dist/index.js ]; then
            echo "::error::Build did not produce dist/index.js"
            exit 1
          fi
          echo "Build artifacts:"
          ls -la dist/

  docker-build:
    name: Docker Build Verify (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [registry, build-test, gateway]
    # PR:只讀快取、不寫(每個 PR 寫一份 ~1.5GB 的 buildkit 快取,dependabot 一多就塞爆 10GB 上限)
    # push dev:寫一份共用快取(scope 綁映像名),所有開往 dev 的 PR 都讀得到
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: docs-mcp-server
            context: ./mcpjungle
            dockerfile: ./mcpjungle/docs-mcp-server/Dockerfile
          - image: docs-registrar
            context: ./mcpjungle
            dockerfile: ./mcpjungle/registry/Dockerfile
          - image: mcpjungle-gateway
            context: ./mcpjungle/gateway
            dockerfile: ./mcpjungle/gateway/Dockerfile.fullbuild
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.context) }}
          push: false
          load: true
          tags: ${{ matrix.image }}:ci-test
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope={0}', matrix.image) || '' }}

  # 彙總:needs 列出上面所有 job,沒列進來的 job 失敗也擋不住合併與發佈
  ci:
    name: ci
    if: always()
    needs: [basics, gateway, registry, build-test, docker-build]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a job in needs ended with '$r'"; exit 1 ;;
            esac
          done
